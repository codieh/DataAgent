[project]
name = "data-agent-claude-sdk"
version = "0.1.0"
description = "Multi-tenant natural language data analysis Agent built with Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "claude-agent-sdk>=0.1.0",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.6.0",
    "pymysql>=1.1.1",
    "python-multipart>=0.0.9",
    "sqlglot>=26.0.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
