[project]
name = "data-agent-python-backend"
version = "0.1.0"
description = "Python backend for the DataAgent desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "chromadb>=1.0.0",
    "fastapi>=0.115.0",
    "greenlet>=3.1.1",
    "langchain-core>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "pymysql>=1.1.1",
    "pydantic-settings>=2.6.0",
    "sqlglot>=26.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "tokenizers>=0.23.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=2.0.0",
    "openpyxl>=3.1.0",
    "langchain>=1.0.0",
]

[project.scripts]
data-agent-index-knowledge = "app.retrieval.index_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
